name: justice_now
description: JusticeNow — Human rights case tracking and management platform.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ─── State Management ─────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ─── Navigation ───────────────────────────────────────
  go_router: ^14.2.7

  # ─── HTTP Client ──────────────────────────────────────
  dio: ^5.4.3+1
  pretty_dio_logger: ^1.3.1

  # ─── Firebase Auth (for NGO/Officer/Admin) ────────────
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4

  # ─── Secure Token Storage ─────────────────────────────
  flutter_secure_storage: ^9.2.2

  # ─── Local Persistence ────────────────────────────────
  shared_preferences: ^2.3.1

  # ─── UI & Theming ─────────────────────────────────────
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.2

  # ─── File Picker & Camera ─────────────────────────────
  file_picker: ^8.0.7
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # ─── Maps (hotspot visualization) ─────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ─── Utils ────────────────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
