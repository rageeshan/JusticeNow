# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# Base: Flutter recommended lints for apps, packages, and plugins.
include: package:flutter_lints/flutter.yaml

# ─── Analyzer ───────────────────────────────────────────────────────────────
analyzer:
  # Exclude auto-generated and platform-specific build output.
  exclude:
    - build/**
    - android/**
    - ios/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gen.dart"

  # Strong-mode: all implicit casts and dynamic types are flagged.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # Treat missing returns as errors (not just warnings).
    missing_return: error
    # Treat invalid overrides as errors.
    invalid_override: error
    # Surface deprecated member usage so we can migrate proactively.
    deprecated_member_use: warning
    deprecated_member_use_from_same_package: warning

# ─── Linter rules ───────────────────────────────────────────────────────────
linter:
  rules:
    # ── Style ────────────────────────────────────────────────────────────────
    prefer_single_quotes: true           # Consistent string quoting
    always_use_package_imports: false    # Relative imports inside lib/ are fine
    directives_ordering: true           # Enforce import block order
    sort_pub_dependencies: false         # Pub order managed manually for clarity

    # ── Performance ──────────────────────────────────────────────────────────
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    avoid_unnecessary_containers: true

    # ── Safety ───────────────────────────────────────────────────────────────
    avoid_print: true                    # Use a logger package instead
    avoid_dynamic_calls: false           # Too noisy with Riverpod dynamic refs
    cancel_subscriptions: true
    close_sinks: true
    unawaited_futures: true
    unnecessary_await_in_return: true

    # ── Dart Idioms ──────────────────────────────────────────────────────────
    prefer_final_locals: true
    prefer_final_in_for_each: true
    unnecessary_final: false
    use_string_buffers: true
    use_super_parameters: true           # Dart 2.17+ super param syntax
    prefer_named_parameters_for_constructors: false

    # ── Flutter specifics ────────────────────────────────────────────────────
    use_full_hex_values_for_flutter_colors: true
    sized_box_for_whitespace: true
    sized_box_shrink_expand: true

# Additional information about this file can be found at
# https://dart.dev/guides/language/analysis-options
